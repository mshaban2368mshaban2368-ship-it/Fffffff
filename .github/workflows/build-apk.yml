name: Build and Release Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ github.run_number }}.${{ github.run_attempt }}
          RELEASE_TITLE: "FA97 Chat v${{ github.run_number }}.${{ github.run_attempt }}"
        run: |
          gh release create "$RELEASE_TAG" \
            app-debug.apk \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes "Automated Debug APK build for FA97 Chat (Commit $GITHUB_SHA). Download the APK below." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ github.run_number }}.${{ github.run_attempt }}
          RELEASE_TITLE: "FA97 Chat v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          echo "============================================="
          echo "Report APK Download Result"
          echo "============================================="
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            ASSET_NAME="app-debug.apk"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            echo "## 🚀 Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title:** $RELEASE_TITLE" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK can be downloaded directly from the **Assets** section of the [GitHub Release]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup under workflow run artifacts." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed or was not completed. APK build and artifact upload succeeded."
            echo "APK build: SUCCEEDED"
            echo "Actions artifact 'app-debug-apk': AVAILABLE"
            echo "## ⚠️ APK Build Succeeded (Release Publishing Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK build and artifact upload succeeded, but GitHub Release publishing encountered an issue or was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "You can download the compiled APK from the **Actions artifact** named \`app-debug-apk\` on this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          fi
